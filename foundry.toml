[profile.default]
solc_version = "0.8.29"
src = "src"
out = "out"
libs = ["lib", "dependencies"]

ast = true
ffi = true

build_info = true
bytecode_hash = "none"
extra_output = ["storageLayout"]

via_ir = true
optimizer = true
optimizer_runs = 200

[fmt]
bracket_spacing = true

[dependencies]
forge-std = "1.10.0"
"@openzeppelin-contracts" = "5.4.0"

[rpc_endpoints]
ethereumSepolia = "${ETH_SEPOLIA_RPC_URL}"
ethereum = "${ETHEREUM_RPC_URL}"
