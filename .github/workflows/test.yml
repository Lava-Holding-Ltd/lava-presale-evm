name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Soldeer Install
        run: |
          forge soldeer install
        id: setup

      - name: Sanity check dependencies layout
        run: |
          set -e
          ls -la dependencies || true
          test -f dependencies/forge-std-1.10.0/src/Script.sol
          test -f dependencies/@openzeppelin-contracts-5.4.0/contracts/access/Ownable.sol
          test -f dependencies/@chainlink-contracts-0.8.0/contracts/src/v0.8/interfaces/AggregatorV3Interface.sol

      - name: Show resolved remappings (debug)
        run: forge config --json | jq '.remappings'

      - name: Run Forge build
        run: |
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test
